<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.2" fill="#2b3640" opacity=".18"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aabb6"/><stop offset="1" stop-color="#7f929e"/></linearGradient></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#dots)"/>
<rect y="900" width="1920" height="180" fill="#6c7e8a"/>
<!-- título -->
<text x="110" y="190" font-family="Arial, sans-serif" font-weight="900" font-size="120" fill="#e8eef2" stroke="#2b3640" stroke-width="6" paint-order="stroke">EL GUEPARDO</text>
<text x="110" y="300" font-family="Arial, sans-serif" font-weight="900" font-size="120" fill="#f2c14e" stroke="#2b3640" stroke-width="6" paint-order="stroke">PIERDE 3 DE 4</text>
<!-- gráfico simple -->
<g font-family="Arial, sans-serif" font-weight="900">
<rect x="110" y="400" width="760" height="70" rx="12" fill="#e8eef2" stroke="#2b3640" stroke-width="5"/>
<rect x="110" y="400" width="190" height="70" rx="12" fill="#f2c14e" stroke="#2b3640" stroke-width="5"/>
<text x="900" y="452" font-size="46" fill="#2b3640">25 % de éxito</text>
<text x="110" y="540" font-size="34" fill="#e8eef2" stroke="#2b3640" stroke-width="3" paint-order="stroke">93 km/h máximo · ~50 km/h de media</text>
<text x="110" y="595" font-size="26" fill="#2b3640">Wilson et al., Nature 2013</text></g>
