<script>

    alcohol: T('Una es el alcohol'), a2006: T('En 2006'), critica: T('Aun así, ese experimento'), terremoto: T('Otra idea es un terremoto'), tercera: T('Y hay una tercera posibilidad'), ninguna: T('Ninguna de las tres está demostrada'),

  const etapas = [];

  const pop = (grupo, t, t0, o = {}) => X.anima(grupo, t, Object.assign({ entra: t0, dur: 0.55, desde: { y: 26, blur: 10, s: 0.97 }, curva: 'firme' }, o));

  // ===== 1 · GANCHO =====

  const cero = tx(eH, 960, 515, '0 personas a bordo', 'g-t', 64, 'middle', RJ);
  // ===== 2 · TÍTULO =====
  const eT = etapa(A.historia, A.compro, 'Expediente abierto');

  // ===== 3 · RUTA =====
  const eR = etapa(A.compro, A.aBordo, 'Lo comprobado: la ruta');
  const NY = [330, 520], GE = [1590, 470], GB = [1180, 560];
  const ruta = el('path', { d: `M${NY[0]} ${NY[1]} Q820 300 ${GE[0]} ${GE[1]}`, fill: 'none', stroke: AM, 'stroke-width': 8, 'stroke-dasharray': '2 18', 'stroke-linecap': 'round' }, eR);
  el('circle', { cx: NY[0], cy: NY[1], r: 16, fill: AM }, eR); tx(eR, NY[0], NY[1] + 62, 'NUEVA YORK', 'g-t', 44);
  const geo = g(eR); el('circle', { cx: GE[0], cy: GE[1], r: 16, fill: AM }, geo); tx(geo, GE[0], GE[1] + 62, 'GÉNOVA', 'g-t', 44);
  tx(eR, 900, 660, 'océano Atlántico', 'g-m', 30); tx(eR, 960, 780, 'esquema, no a escala', 'g-m', 22);
  const cargaC = g(eR); tarjeta(cargaC, 700, 780, 520, 120); tx(cargaC, 960, 850, '1.701 barriles de alcohol', 'g-t', 44, 'middle', AM); tx(cargaC, 960, 885, 'alcohol industrial desnaturalizado', 'g-m', 22);
  sello(eR, 1640, 760, 'CONFIRMADO', VD, -5, 30);
  const shipR = g(eR); const b2 = barco(shipR); shipR.setAttribute('transform', 'translate(0 0) scale(0.35)');
  // ===== 4 · A BORDO =====

  const gb = per.map(([r, n, t0], i) => { const gg = g(eB); const x = 340 + i * 420; tarjeta(gg, x - 180, 330, 360, 280); el('circle', { cx: x, cy: 420, r: 34, fill: AM }, gg); el('path', { d: `M${x - 56} 520 Q${x} 440 ${x + 56} 520 Z`, fill: AM }, gg); tx(gg, x, 560, n, 'g-t', 42); tx(gg, x, 596, r.toUpperCase(), 'g-m', 24); return { gg, t0 }; });
  const tripu = g(eB); for (let i = 0; i < 7; i++) { el('circle', { cx: 480 + i * 160, cy: 740, r: 24, fill: 'none', stroke: AM, 'stroke-width': 5 }, tripu); el('path', { d: `M${480 + i * 160 - 34} 810 Q${480 + i * 160} 750 ${480 + i * 160 + 34} 810`, fill: 'none', stroke: AM, 'stroke-width': 5 }, tripu); }

  const fich = hallazgos.map(([t0, s, c], i) => { const gg = g(eF); const col = i % 2, row = Math.floor(i / 2); const x = 1010 - 0 + col * 0, y = 180 + i * 96; tarjeta(gg, 1040, y, 760, 80, c); tx(gg, 1420, y + 53, s, 'g-f', 34); return { gg, t0 }; });
  const sinTor = g(eF); tx(sinTor, 420, 330, 'sin tormenta', 'g-t', 54, 'middle', AM); tx(sinTor, 420, 385, 'sin ataque · sin incendio', 'g-f', 34);
  const vacio = g(eF); tx(vacio, 420, 490, 'solo un vacío', 'g-t', 64, 'middle', RJ);
  // ===== 6 · GIBRALTAR =====
  const eG = etapa(A.gib, A.que, 'Gibraltar: la investigación');
  const rg = el('path', { d: `M300 620 Q760 420 ${GB[0]} ${GB[1]}`, fill: 'none', stroke: AM, 'stroke-width': 8, 'stroke-dasharray': '2 18', 'stroke-linecap': 'round' }, eG);
  el('circle', { cx: GB[0], cy: GB[1], r: 18, fill: AM }, eG); tx(eG, GB[0], GB[1] + 64, 'GIBRALTAR', 'g-t', 48); tx(eG, 760, 560, '≈ 1.300 km', 'g-m', 30);
  const sol = g(eG); tarjeta(sol, 220, 700, 860, 140); tx(sol, 650, 765, 'Frederick Solly-Flood', 'g-t', 52, 'middle', AM); tx(sol, 650, 810, 'dirige la investigación · sospecha', 'g-m', 24);
  const sc = g(eG); sello(sc, 1450, 760, 'SIN PRUEBAS DE CRIMEN', RJ, -4, 34);
  // ===== 7 · TEORÍAS DESCARTADAS =====
  const eTe = etapa(A.que, A.luego, 'Teorías sin pruebas');
  const teor = [[A.motin, 'MOTÍN', 'no hay signos de violencia'], [A.piratas, 'PIRATAS', 'la carga seguía allí'], [A.monstruo, 'MONSTRUO MARINO', 'ninguna prueba']].map(([t0, n, s], i) => { const gg = g(eTe); const x = 240 + i * 520; tarjeta(gg, x, 300, 460, 420, RJ); tx(gg, x + 230, 400, n, 'g-t', 52, 'middle', TX); tx(gg, x + 230, 470, s, 'g-f', 32, 'middle', 'rgba(243,238,230,.75)'); sello(gg, x + 230, 600, 'SIN PRUEBAS', RJ, -6, 34); return { gg, t0 }; });
  tx(eTe, 960, 870, 'lo que no encaja con los hechos', 'g-m', 28);
  // ===== 8 · HIPÓTESIS =====
  const eHi = etapa(A.luego, A.ahora, 'Hipótesis (no demostradas)');
  const cuerpo = g(eHi); el('path', { d: 'M260 520 L860 520 L800 640 L320 640 Z', fill: 'rgba(20,25,34,.95)', stroke: TX, 'stroke-width': 5 }, cuerpo);
  for (let i = 0; i < 5; i++) { el('ellipse', { cx: 360 + i * 100, cy: 560, rx: 36, ry: 22, fill: 'none', stroke: AM, 'stroke-width': 4 }, cuerpo); }
  const humo = X.humo(cuerpo, { ruta: (u) => [560, 520 - 210 * u], n: 14, vida: 2.8, tam: [28, 70], color: '#E8A33D', op: 0.5, semilla: 11, viento: [30, -10] });
  tx(cuerpo, 560, 720, 'BODEGA · vapor de alcohol', 'g-m', 26);
  const hip1 = g(eHi); tarjeta(hip1, 980, 180, 840, 150, AM); tx(hip1, 1340, 245, '1 · Vapor de alcohol', 'g-f', 34); tx(hip1, 1340, 300, 'miedo a una explosión → abandono en el bote', 'g-m', 24); sello(hip1, 1715, 215, 'HIPÓTESIS', AM, -6, 24);
  const sella = g(eHi); tarjeta(sella, 980, 350, 840, 130, AZ); tx(sella, 1400, 410, '2006 · UCL (Andrea Sella): maqueta, llamarada', 'g-f', 34); tx(sella, 1400, 455, 'onda de presión sin marcas de fuego', 'g-m', 24);
  const crit = g(eHi); tarjeta(crit, 980, 500, 840, 130, RJ); tx(crit, 1400, 560, 'Críticas: no usó alcohol real', 'g-f', 34); tx(crit, 1400, 605, 'y en el barco no había señales de explosión', 'g-m', 24);
  const terr = g(eHi); tarjeta(terr, 980, 650, 840, 100, AM); tx(terr, 1340, 715, '2 · Terremoto submarino', 'g-f', 36); sello(terr, 1715, 700, 'HIPÓTESIS', AM, -6, 24);
  const aban = g(eHi); tarjeta(aban, 980, 770, 840, 100, AM); tx(aban, 1340, 835, '3 · Abandono preventivo', 'g-f', 36); sello(aban, 1715, 820, 'HIPÓTESIS', AM, -6, 24);
  const nin = g(eHi); sello(nin, 560, 840, 'NINGUNA DEMOSTRADA', RJ, -4, 34);
  // ===== 9 · CONAN DOYLE =====
  const eD = etapa(A.ahora, A.resumamos, 'Lo que la leyenda añadió');
  tx(eD, 960, 175, 'LO QUE AÑADIÓ LA LEYENDA', 'g-t', 76, 'middle', AM);
  const rev = g(eD); tarjeta(rev, 360, 230, 520, 380, AM); tx(rev, 620, 330, 'CORNHILL', 'g-t', 54); tx(rev, 620, 385, 'MAGAZINE', 'g-t', 54); tx(rev, 620, 470, 'enero de 1884', 'g-m', 28); tx(rev, 620, 540, '«Marie Celeste»', 'g-t', 52, 'middle', AM); tx(rev, 620, 585, 'relato anónimo', 'g-m', 22);
  const fic = g(eD); sello(fic, 1260, 330, 'FICCIÓN', RJ, -8, 56); tx(fic, 1260, 420, '(su autor: Arthur Conan Doyle)', 'g-f', 34, 'middle', 'rgba(243,238,230,.8)');
  const fis = g(eD); tarjeta(fis, 1000, 480, 800, 180, TX); tx(fis, 1400, 560, '«una fabricación de principio a fin»', 'g-t', 44); tx(fis, 1400, 620, 'Solly-Flood, fiscal de Gibraltar', 'g-m', 26);
  const mesa = g(eD); tarjeta(mesa, 360, 700, 1440, 150, AM); tx(mesa, 1080, 765, 'Mesa puesta, comida caliente…', 'g-t', 54); tx(mesa, 1080, 815, 'parte de la leyenda', 'g-m', 26); sello(mesa, 1650, 770, 'SIN CONFIRMAR', RJ, -5, 28);
  // ===== 10 · RESUMEN =====
  const eS = etapa(A.resumamos, A.nosabemos, 'Resumen del expediente');

  // ===== 11 · CIERRE =====

  const marC = mar(eC, 800); const shipC = g(eC); const b4 = barco(shipC);
  const q = tx(eC, 960, 270, '¿Qué pasó a bordo?', 'g-t', 120, 'middle', AM);
  const q2 = g(eC); tx(q2, 960, 360, 'quién · cómo · por qué', 'g-m', 36);
  const ids = A;
  // ---------- fondo, subtítulos ----------
  const fondo = g(C, { opacity: 0.5 }); C.insertBefore(fondo, C.firstChild);
  const orbes = Array.from({ length: 5 }, (_, i) => { const c = el('circle', { r: 180 + i * 30, fill: i % 2 ? AZ : AM, opacity: 0.045 }, fondo); c.style.filter = 'blur(60px)'; return c; });
  const grano = X.grano($('lienzo'), 0.07);
  const subs = X.subtitulos($('subs'), { max: 4, y: 950, claves: ['Mary', 'Celeste', 'verdad', 'hipótesis', 'ficción'] });
  const cam = [{ t: 0, x: 960, y: 540, z: 1.0 }, { t: A.dia4, x: 960, y: 540, z: 1.0 }, { t: A.luego, x: 960, y: 540, z: 1.0 }];
  X.sonido(A.diez, 'whoosh', 0.5); X.sonido(A.nunca, 'pop', 0.7); X.sonido(A.historia, 'whoosh', 0.8); X.sonido(A.vacio, 'pop', 0.7);
  etapas.forEach((e) => { if (e.ini > 1) X.sonido(e.ini, 'whoosh', 0.4); });
  X.sonido(A.ficcion, 'pop', 0.8); X.sonido(A.ninguna, 'pop', 0.7);

  return (t) => {

    $('barra').style.width = (100 * t / X.dur).toFixed(2) + '%';

    const bob = (n, k = 1) => 12 * k * Math.sin(t * 0.9 + n);
    // gancho
    marH(t); shipH.setAttribute('transform', `translate(${1150 + 20 * Math.sin(t * 0.3)} ${770 + bob(0)}) rotate(${3 * Math.sin(t * 0.7)}) scale(0.72)`);
    X.anima(hT, t, { entra: 0, dur: 0.5, desde: { y: -20, blur: 12 } });
    pts.forEach((p, i) => { const tin = A.diez + i * 0.12, tout = A.nunca + i * 0.1; const o = (t < tin ? 0 : 1) * (1 - sm(seg(t, tout, tout + 0.5))); p.setAttribute('opacity', o.toFixed(3)); });
    pop(cero, t, A.nunca + 1.3, { desde: { y: 14, s: 0.9, blur: 10 } });
    // ruta
    X.traza(ruta, t, A.zarpo, 2.2); pop(geo, t, A.genova); pop(cargaC, t, A.b1701 - 0.3);
    const pr = sm(seg(t, A.zarpo, A.b1701 + 1)); shipR.setAttribute('transform', `translate(${L(NY[0], GE[0], pr) - 0} ${L(NY[1] - 5, GE[1] - 90, pr) - 20}) scale(0.28)`);
    // a bordo
