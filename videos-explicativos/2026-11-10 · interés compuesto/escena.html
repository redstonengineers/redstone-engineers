X.listo(() => {

  // ---------- componente: barras del céntimo (30 días) ----------

      lab.setAttribute('x', Math.min(ex, x0 + w - 120)); lab.setAttribute('y', ey - 34); lab.textContent = label && xe > 0.01 ? fy(f(xe)) : ''; lab.setAttribute('fill', color);

  const cr2 = g(eCru); tarjeta(cr2, 300, 580, 1320, 200, OR); tx(cr2, 960, 690, 'Intereses sobre lo que aún debes…', 'g-t', 66, 'middle', OR); tx(cr2, 960, 750, '…incluidos los intereses anteriores', 'g-f', 40);
